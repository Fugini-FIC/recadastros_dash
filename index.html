<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Recadastro · Em manutenção</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
    background: #f0f2f5; color: #1a1a2e; padding: 16px;
  }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
    max-width: 420px; width: 100%; padding: 32px 28px; text-align: center;
    border-top: 4px solid #D2001B;
  }
  .marca { font-size: 12px; letter-spacing: 3px; color: #D2001B; font-weight: 700; text-transform: uppercase; }
  h1 { font-size: 20px; margin: 14px 0 10px; }
  p { font-size: 14px; line-height: 1.55; color: #555; margin: 0 0 10px; }
  .destaque { background: #fff5f5; border-radius: 8px; padding: 12px; margin-top: 18px; font-size: 13px; color: #7a1f1f; }
</style>
</head>
<body>
  <div class="card">
    <div class="marca">Fugini · Recadastro</div>
    <h1>Painel em manutenção</h1>
    <p>O painel de acompanhamento do recadastro está passando por uma atualização e vai mudar de endereço.</p>
    <div class="destaque">Endereço novo em breve. Você vai receber o link assim que estiver no ar.</div>
  </div>
</body>
</html>
